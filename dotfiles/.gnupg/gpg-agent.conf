# Headless/SSH: curses pinentry (renders over a console, not a GUI).
pinentry-program /home/linuxbrew/.linuxbrew/bin/pinentry-curses
# Use brew's scdaemon (opt path survives brew upgrades). The system 2.4.x
# agent socket-activated by systemd has no scdaemon → mask it (see `make gpg`).
scdaemon-program /home/linuxbrew/.linuxbrew/opt/gnupg/libexec/scdaemon
# PIN/agent cache TTLs (seconds): 10 min idle, 2 h max.
default-cache-ttl 600
max-cache-ttl 7200
