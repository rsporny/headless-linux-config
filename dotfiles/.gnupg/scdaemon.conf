# Route the YubiKey through pcscd, NOT scdaemon's internal CCID driver
# (which hangs ~30s then "ccid open error" on VM USB passthrough).
disable-ccid
# libpcsclite path is arch-specific. aarch64 (Apple-silicon Parallels VMs):
pcsc-driver /usr/lib/aarch64-linux-gnu/libpcsclite.so.1
# For x86_64 hosts use instead:
# pcsc-driver /usr/lib/x86_64-linux-gnu/libpcsclite.so.1
#
# NOTE: do NOT add `pcsc-shared`. Shared access resets the OpenPGP applet's
# PW1 verification between every gpg call, forcing a PIN prompt on every
# signature. Exclusive access keeps PW1 verified across a card session.
# Re-add only if another process needs the reader concurrently.
